program: src/train.py
method: bayes 

metric:
  name: val_acc
  goal: maximize

parameters:
  learning_rate:
    distribution: log_uniform_values
    min: 1e-6
    max: 3e-5

  warmup_ratio:
    distribution: uniform
    min: 0.0
    max: 0.2

  weight_decay:
    distribution: log_uniform_values
    min: 1e-4
    max: 1e-1

  epochs:
    values: [3]

  train_batch_size:
    values: [2]

  val_batch_size:
    values: [2]
